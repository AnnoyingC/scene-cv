<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书房素材候选</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* 布局：顶部说明 + 筛选条（吸顶），下面按分组排缩略图网格，底部固定一条"已选"栏 */
:root {
  --bg: #f3efe6; --panel: #fffdf8; --ink: #2a241c; --muted: #7a6f60; --line: #ddd3c2;
  --accent: #8a5a1f; --accent-soft: #f1e2c8; --cc0: #2f6b4f; --ccby: #6b4f8a; --warn: #a2482f;
  --display: "Cormorant Garamond", "Noto Serif SC", "Songti SC", serif;
  --title: "Noto Serif SC", "Songti SC", "STSong", serif;
  --body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17140f; --panel: #211c15; --ink: #eee5d6; --muted: #a89a86; --line: #3a3127;
  --accent: #e0a858; --accent-soft: #3a2c1a; --cc0: #7fcfa6; --ccby: #c2a6e6; --warn: #ee8a6a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17140f; --panel: #211c15; --ink: #eee5d6; --muted: #a89a86; --line: #3a3127;
  --accent: #e0a858; --accent-soft: #3a2c1a; --cc0: #7fcfa6; --ccby: #c2a6e6; --warn: #ee8a6a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 36px 18px; display: grid; gap: 10px; }
header.top .eyebrow { font: 600 13px/1 var(--display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
header.top h1 { margin: 0; font: 700 30px/1.25 var(--title); text-wrap: balance; }
header.top p { margin: 0; max-width: 68ch; color: var(--muted); }
.rules { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.rules b { color: var(--ink); font-weight: 500; }

.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px; }
.bar .label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .card:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-block: 16px 4px; font-size: 13px; }
nav.toc a { color: var(--muted); text-decoration: none; }
nav.toc a:hover { color: var(--accent); }

section.src { padding-block: 22px 8px; }
section.src > h2 { margin: 0 0 4px; font: 600 26px/1.2 var(--display); }
section.src > h2 small { font: 500 14px var(--body); color: var(--muted); margin-left: 10px; }
section.src > p { margin: 0 0 6px; color: var(--muted); max-width: 72ch; }
.group { padding-block: 14px 6px; }
.group h3 { margin: 0 0 10px; font: 700 16px/1.3 var(--title); display: flex; gap: 10px; align-items: baseline; }
.group h3 span { font: 400 12px var(--body); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 12px; }

.card { position: relative; display: grid; grid-template-rows: auto 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); }
.card[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.card .img { aspect-ratio: 1; background: #fff; display: grid; place-items: center; overflow: hidden; }
.card.tex .img, .card.sf .img { background: var(--line); }
.card img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card.tex img, .card.sf img { object-fit: cover; }
.card .tick { position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 15px; color: transparent; }
.card[aria-checked="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.card .body { padding: 8px 10px 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.card .zh { font-weight: 500; line-height: 1.35; }
.card .en { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lic { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.lic.cc0 { color: var(--cc0); } .lic.by { color: var(--ccby); }
.heavy { color: var(--warn); }
.card .open { font-size: 12px; color: var(--accent); text-decoration: none; justify-self: start; }
.card .open:hover { text-decoration: underline; }

.more { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 4px; }
.more a { font-size: 13px; color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }

footer.pick { position: sticky; bottom: 0; z-index: 5; background: var(--ink); color: var(--bg); margin-top: 30px; }
footer.pick .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px)); }
footer.pick .count { font-variant-numeric: tabular-nums; }
footer.pick .names { flex: 1 1 240px; min-width: 0; font-size: 12px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer.pick button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer; background: var(--accent); color: var(--ink); }
footer.pick button.ghost { background: transparent; color: var(--bg); border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); }
.empty { padding: 28px 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } header.top h1 { font-size: 24px; } }
</style>
</head>
<body>
<header class="top wrap">
  <div class="eyebrow">Study · asset shortlist</div>
  <h1>书房素材候选：点卡片勾选，选完复制清单发给我</h1>
  <p>全部是可以免费用在个人网站上的模型和材质，按书房里的位置分组。缩略图直接从素材站加载，这一页不会下载任何文件。勾选会记在这个浏览器里，刷新也还在。</p>
  <div class="rules">
    <span><b>CC0</b>：随便用，不用署名</span>
    <span><b>CC-BY</b>：可以用，网站上写一行作者署名</span>
    <span><b>下载</b>：原始文件大小（1K 贴图版）；导入后会减面、只留颜色贴图，网页里实际会小很多</span>
    <span class="heavy"><b class="heavy">偏重</b>：面数或文件很大，用的话我会先简化</span>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <span class="label">来源</span>
    <div class="chips" id="f-src"></div>
    <span class="label">许可证</span>
    <div class="chips" id="f-lic"></div>
    <div class="chips"><button class="chip" id="f-picked" aria-pressed="false">只看已选</button></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer class="pick">
  <div class="wrap">
    <span class="count" id="count">还没有勾选</span>
    <span class="names" id="names"></span>
    <button class="ghost" id="clear" type="button">清空</button>
    <button id="copy" type="button">复制清单</button>
  </div>
</footer>

const state = { src: new Set(SRC.map((s) => s.key)), lic: new Set(['cc0', 'by']), picked: false };

const items = [

];
const byKey = new Map(items.map((i) => [i.key, i]));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const k = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n));

function card(i) {
  const lic = `<span class="lic ${i.lic}">${i.lic === 'cc0' ? 'CC0' : 'CC-BY'}</span>`;
  let meta = '';
  if (i.src === 'ph') meta = `${lic}<span>${k(i.poly)} 面</span><span>下载 ${i.mb1k} MB</span>${i.dims?.length ? `<span>${i.dims.join('×')} cm</span>` : ''}`;
  else if (i.src === 'tex') meta = `${lic}<span>无缝材质</span>`;
  else meta = `${lic}<span>${k(i.faces)} 面</span><span>作者 ${esc(i.user)}</span>`;
  if (i.heavy) meta += `<span class="heavy">偏重</span>`;
  const zh = esc(i.note || i.group);
  const en = i.src === 'sf' ? esc(i.name) : esc(i.name);
  return `<div class="card ${i.src}" role="checkbox" tabindex="0" aria-checked="${picks.has(i.key)}" data-key="${esc(i.key)}">
    <div class="img"><img loading="lazy" src="${esc(i.img)}" alt="${en}"></div>

  </div>`;

function render() {
  const show = (i) => state.src.has(i.src) && state.lic.has(i.lic) && (!state.picked || picks.has(i.key));

  html += '</nav>';
  let any = false;
  for (const s of SRC) {
    if (!state.src.has(s.key)) continue;
    const list = items.filter((i) => i.src === s.key && show(i));
    if (!list.length) continue;
    any = true;
    const groups = [...new Set(list.map((i) => i.group))];
    html += `<section class="src" id="s-${s.key}"><h2>${s.title}<small>${list.length} 个</small></h2><p>${s.blurb}</p>`;
    for (const g of groups) {
      const gl = list.filter((i) => i.group === g);
      html += `<div class="group"><h3>${esc(g)}<span>${gl.length}</span></h3><div class="grid">${gl.map(card).join('')}</div></div>`;
    }
    if (s.key === 'sf' && !state.picked) {
      html += `<div class="group"><h3>想多看一些<span>Sketchfab 搜索，进去后在左侧 License 里勾 CC0 和 CC Attribution</span></h3><div class="more">` +
        DATA.sfq.map(([zh, q]) => `<a href="https://sketchfab.com/search?features=downloadable&type=models&q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(zh)} ↗</a>`).join('') + '</div></div>';
    }
    html += '</section>';
  }
  if (!any) html += '<p class="empty">这组筛选下没有素材。把上面的来源或许可证多勾几个，或者关掉"只看已选"。</p>';
  document.getElementById('main').innerHTML = html;
  updateFooter();
}

function updateFooter() {
  const n = picks.size;
  document.getElementById('count').textContent = n ? `已选 ${n} 项` : '还没有勾选';
  document.getElementById('names').textContent = [...picks].map((key) => byKey.get(key)).filter(Boolean).map((i) => i.note || i.group).join('、');
}

function toggle(el) {
  const key = el.dataset.key;
  picks.has(key) ? picks.delete(key) : picks.add(key);
  el.setAttribute('aria-checked', String(picks.has(key)));
  save();
  if (state.picked && !picks.has(key)) render(); else updateFooter();
}
document.getElementById('main').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const c = e.target.closest('.card');
  if (c) toggle(c);
});
document.getElementById('main').addEventListener('keydown', (e) => {
  const c = e.target.closest('.card');
  if (c && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); toggle(c); }
});

function chips(id, opts, set) {
  const box = document.getElementById(id);
  box.innerHTML = opts.map(([v, label]) => `<button class="chip" data-v="${v}" aria-pressed="${set.has(v)}">${label}</button>`).join('');
  box.addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute('aria-pressed', String(set.has(v)));
    render();
  });
}
chips('f-src', SRC.map((s) => [s.key, s.short]), state.src);
chips('f-lic', [['cc0', 'CC0'], ['by', 'CC-BY']], state.lic);
document.getElementById('f-picked').addEventListener('click', (e) => {
  state.picked = !state.picked;
  e.currentTarget.setAttribute('aria-pressed', String(state.picked));
  render();
});

function listText() {
  const rows = [...picks].map((key) => byKey.get(key)).filter(Boolean);
  if (!rows.length) return '';
  const order = { ph: 0, tex: 1, sf: 2 };
  rows.sort((a, b) => order[a.src] - order[b.src]);
  return '我选的素材：\n' + rows.map((i) => i.src === 'sf'
    ? `- [Sketchfab ${i.lic === 'cc0' ? 'CC0' : 'CC-BY'}] ${i.note || i.group}：${i.name}（${i.user}） ${i.href}`
    : `- [${i.src === 'ph' ? 'Poly Haven 模型' : 'Poly Haven 材质'}] ${i.note}：${i.id}`).join('\n');
}
window.__picks = () => listText(); // 在 app 的内置浏览器里选的话，Claude 可以直接读这个
const copyBtn = document.getElementById('copy');
copyBtn.addEventListener('click', async () => {
  const t = listText();
  if (!t) { copyBtn.textContent = '先勾选几项'; setTimeout(() => (copyBtn.textContent = '复制清单'), 1400); return; }
  try { await navigator.clipboard.writeText(t); copyBtn.textContent = '已复制，粘贴给 Claude'; }
  catch (e) { prompt('复制下面的清单：', t); }
  setTimeout(() => (copyBtn.textContent = '复制清单'), 2000);
});
document.getElementById('clear').addEventListener('click', () => { picks.clear(); save(); render(); });
render();
</script>
</body>
</html>
