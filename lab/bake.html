<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烘焙光照实验</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: dark; --fg: #e8e3d6; --dim: #9a9486; --line: rgba(255,255,255,.12); --accent: #e8b04a; }
  html, body { margin: 0; height: 100%; background: #06070b; color: var(--fg);
    font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .panel { position: fixed; top: 16px; left: 16px; width: 280px; max-height: calc(100% - 32px); overflow: auto;
    background: rgba(12,13,18,.78); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .row { margin: 10px 0; }
  .row > span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13px; color: var(--fg); background: rgba(255,255,255,.06); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.12); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 12px 0 0;
    padding-top: 10px; border-top: 1px solid var(--line); }
  dt { color: var(--dim); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  @media (max-width: 600px) {
    .panel { top: auto; bottom: 0; left: 0; width: 100%; max-height: 46%; border-radius: 12px 12px 0 0; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="status">加载中…</div>
<aside class="panel">
  <h1>烘焙光照实验</h1>
  <p class="sub">房间的光照是 Blender Cycles 预先算好的贴图，浏览器只做混合。拖动转头（左边书架、右边唱机），滚轮缩放。</p>
  <div class="row">
    <span>灯（屋里灯 = 落地灯、串灯、书架灯带、柜上台灯）</span>
    <div class="btns"><button id="room" aria-pressed="true">屋里灯 开</button><button id="lamp" aria-pressed="true">书桌台灯 开</button><button id="home">回到书桌</button></div>
  </div>
  <div class="row">
    <span>电视（换带子，看墙面颜色跟着变）</span>
    <div class="btns" id="tapes"></div>
  </div>
  <div class="row">
    <span>显示</span>
    <div class="btns" id="views"></div>
  </div>
  <div class="row">
    <span>曝光 <output id="expOut">1.00</output></span>
    <input id="exp" type="range" min="0.3" max="3" step="0.01" value="1">
  </div>
  <dl id="info"></dl>
  <p class="sub" style="margin:12px 0 0"><a href="../?room=1">← 回到实时光照版</a></p>
</aside>
<script type="module" src="bake.js"></script>
</body>
</html>
